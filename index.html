<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>txt2qr</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: #000;
    color: #fff;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 480px; margin: 0 auto; padding: 40px 20px; }
  input {
    width: 100%; max-width: 100%; padding: 14px 22px;
    border: none; border-radius: 999px;
    background: #fff; color: #141414;
    font: inherit; font-size: 16px; outline: none;
  }
  .error { color: #ff6b60; font-size: 13px; margin: 12px 0 0; }
  .qr {
    margin-top: 24px; width: 100%; max-width: 100%; aspect-ratio: 1 / 1;
    border-radius: 16px; overflow: hidden;
  }
  canvas { display: block; width: 100%; max-width: 100%; height: 100%; }
  @media (max-width: 480px) {
    .wrap { padding: 24px 16px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <input id="input" type="search" placeholder="输入文字或链接" maxlength="2000" autofocus>
  <p class="error" id="error" hidden></p>
  <div class="qr">
    <canvas id="qr" hidden></canvas>
  </div>
</div>

<script src="js/qrcode.min.js"></script>
<script>
  // 纠错级别：手动改这里即可，页面上不显示选择项
  // L = 低（容量最大，约 7% 损坏可恢复）
  // M = 中（默认，约 15% 损坏可恢复）
  // Q = 较高（约 25% 损坏可恢复）
  // H = 高（约 30% 损坏可恢复，容量最小）
  var ERROR_CORRECTION_LEVEL = 'M';

  var input = document.getElementById('input');
  var canvas = document.getElementById('qr');
  var error = document.getElementById('error');
  var timer = null;

  function render() {
    var text = input.value;
    if (!text.trim()) {
      canvas.hidden = true;
      error.hidden = true;
      return;
    }
    QRCode.toCanvas(canvas, text, {
      errorCorrectionLevel: ERROR_CORRECTION_LEVEL,
      width: 1024,
      margin: 2,
      color: { dark: '#141414', light: '#ffffff' }
    }, function (err) {
      if (err) {
        error.textContent = '内容过长，请缩短后再试。';
        error.hidden = false;
        return;
      }
      error.hidden = true;
      canvas.hidden = false;
      // 库生成时会把 canvas 内联样式写成 1024px，盖掉 CSS，造成手机端溢出；
      // 这里生成完立即改回 100%，显示尺寸跟随容器，画布本身的 1024 分辨率不受影响
      canvas.style.width = '100%';
      canvas.style.height = '100%';
    });
  }

  input.addEventListener('input', function () {
    clearTimeout(timer);
    timer = setTimeout(render, 180);
  });

  // 原生清除按钮点按时也立即刷新（部分浏览器只触发 search 事件）
  input.addEventListener('search', render);

  var preset = new URLSearchParams(location.search).get('text') || new URLSearchParams(location.search).get('q');
  if (preset) input.value = preset;
  render();
</script>
</body>
</html>
